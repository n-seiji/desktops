name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match JD_VERSION
        run: |
          version="$(sed -n 's/^#define JD_VERSION "\(.*\)"$/\1/p' src/common.h)"
          [ -n "$version" ] || { echo "JD_VERSION not found in src/common.h" >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match JD_VERSION v$version" >&2; exit 1; }
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: mise run dist
      - run: mise run dist-app
      - name: Checksums for the tarballs
        run: |
          cd dist
          for f in just-desktops-darwin-*.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.app.zip
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.app.zip dist/*.app.zip.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
