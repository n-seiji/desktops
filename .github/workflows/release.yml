name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match JD_VERSION
        run: |
          version="$(sed -n 's/^#define JD_VERSION "\(.*\)"$/\1/p' src/common.h)"
          [ -n "$version" ] || { echo "JD_VERSION not found in src/common.h" >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match JD_VERSION v$version" >&2; exit 1; }
      - name: Check signing and notarization secrets
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -eu
          signing=0
          notarize=0
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ]; then
            signing=1
          elif [ -n "$P12_BASE64$P12_PASSWORD" ]; then
            echo "DEVELOPER_ID_P12_BASE64 and DEVELOPER_ID_P12_PASSWORD must be set together" >&2; exit 1
          fi
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8_BASE64" ]; then
            notarize=1
          elif [ -n "$KEY_ID$ISSUER_ID$KEY_P8_BASE64" ]; then
            echo "ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8_BASE64 must be set together" >&2; exit 1
          fi
          if [ "$notarize" = 1 ] && [ "$signing" = 0 ]; then
            echo "notarization needs the Developer ID certificate secrets" >&2; exit 1
          fi
          echo "SIGNING=$signing" >> "$GITHUB_ENV"
          echo "NOTARIZE=$notarize" >> "$GITHUB_ENV"
          echo "signing=$signing notarize=$notarize (0 means ad-hoc, as before)"
      - name: Import Developer ID certificate
        if: env.SIGNING == '1'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/jd-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          p12="$RUNNER_TEMP/developer-id.p12"
          (umask 077; printf '%s' "$P12_BASE64" | base64 --decode > "$p12")
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | sed 's/^ *"//; s/"$//')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          security default-keychain -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^ *[0-9]*) [0-9A-F]* "\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "no 'Developer ID Application' identity in the imported certificate" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "signing with: $identity"
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: mise run dist
      - run: mise run dist-app
      - name: Notarize and staple
        if: env.NOTARIZE == '1'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -eu
          export ASC_KEY_P8="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s' "$KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_P8")
          # Bare Mach-O binaries cannot be stapled. Notarizing them lets Gatekeeper find the ticket online.
          cli="$RUNNER_TEMP/cli-notarize"
          mkdir -p "$cli/arm64" "$cli/x86_64"
          cp dist/arm64/just-desktops "$cli/arm64/"
          cp dist/x86_64/just-desktops "$cli/x86_64/"
          ditto -c -k "$cli" "$RUNNER_TEMP/just-desktops-cli.zip"
          scripts/notarize.sh dist/just-desktops-*.app.zip "$RUNNER_TEMP/just-desktops-cli.zip"
          xcrun stapler staple dist/just-desktops.app
          scripts/package-app.sh
      - name: Verify signatures
        if: env.SIGNING == '1'
        run: |
          set -eu
          codesign --verify --strict --verbose=2 dist/arm64/just-desktops
          codesign --verify --strict --verbose=2 dist/x86_64/just-desktops
          codesign --verify --deep --strict --verbose=2 dist/just-desktops.app
          codesign -dvv dist/just-desktops.app 2>&1 | grep -E 'Authority|TeamIdentifier|flags|Timestamp'
          if [ "$NOTARIZE" = 1 ]; then
            check="$RUNNER_TEMP/verify-app"
            rm -rf "$check"; mkdir -p "$check"
            ditto -x -k dist/just-desktops-*.app.zip "$check"
            xcrun stapler validate "$check/just-desktops.app"
            spctl --assess --type execute --verbose=4 "$check/just-desktops.app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
            grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
          fi
      - name: Checksums
        run: |
          cd dist
          for f in just-desktops-darwin-*.tar.gz just-desktops-*.app.zip; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.app.zip
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.app.zip dist/*.app.zip.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Remove signing keychain and keys
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
