<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 480 360" fill="none" role="img" aria-label="Focus border">
  <style>
    .f { opacity: 0; animation: show 1.6s infinite; }
    @keyframes show { 0% { opacity: 0 } 4% { opacity: 1 } 100.00% { opacity: 1 } 104.00% { opacity: 0 } 100% { opacity: 0 } }
    .press { opacity: 0; animation: press 1.6s infinite; }
    @keyframes press { 0% { opacity: 0.9 } 18% { opacity: 0 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .f, .press { animation: none } .f0 { opacity: 1 } }
    
    .f0 { animation-delay: -1.60s; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="44" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="479" height="359" rx="43.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="232" y="76" width="168" height="150" rx="12" fill="#2c2c31"/>
  <rect x="96" y="112" width="210" height="160" rx="12" fill="#3a3a40"/>
  <rect x="86" y="102" width="230" height="180" rx="22" stroke="#ffffff" stroke-width="6"/>
</svg>
