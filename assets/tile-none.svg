<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 480 360" fill="none" role="img" aria-label="Apps on every desktop">
  <style>
    .f { opacity: 0; animation: show 3.2s infinite; }
    @keyframes show { 0% { opacity: 0 } 4% { opacity: 1 } 50.00% { opacity: 1 } 54.00% { opacity: 0 } 100% { opacity: 0 } }
    .press { opacity: 0; animation: press 1.6s infinite; }
    @keyframes press { 0% { opacity: 0.9 } 18% { opacity: 0 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .f, .press { animation: none } .f0 { opacity: 1 } }
    
    .f0 { animation-delay: -3.20s; }
    .f1 { animation-delay: -1.60s; }
  </style>
